name: journal
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
  actions: write
jobs:
  add:
    if: github.actor == github.repository_owner && startsWith(github.event.issue.title, 'journal:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append entry
        run: |
          python3 - <<'PY'
          import json,os,re
          m=re.search(r'```json\s*(\{.*?\})\s*```',os.environ['BODY'],re.S)
          e=json.loads(m.group(1))
          keep=['id','date','symbol','tf','side','entry','stop','exit','result','notes']
          e={k:str(e.get(k,''))[:500] for k in keep}
          J=json.load(open('journal.json'))
          if not any(x.get('id')==e['id'] for x in J):J.append(e)
          json.dump(J,open('journal.json','w'),indent=1)
          PY
          git config user.name "journal-bot"; git config user.email "bot@users.noreply.github.com"
          git add journal.json; git commit -m "Journal entry" || true; git push
          gh workflow run refresh.yml
          gh issue close ${{ github.event.issue.number }} --comment "Logged."
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ github.event.issue.body }}
